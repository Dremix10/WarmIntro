name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-build-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # Build needs *some* placeholder values for these — the actual values
          # are pulled from Vercel env at deploy time. Using fake-but-syntactically-
          # valid placeholders so build doesn't fail on env validation.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder
          ANTHROPIC_API_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.placeholder

  smoke-prod:
    runs-on: ubuntu-latest
    needs: typecheck-build-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deploy to settle
        run: sleep 90

      - name: Run prod smoke tests
        run: bash scripts/smoke.sh https://www.alma.careers
